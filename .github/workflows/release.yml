name: Release

# Rolling release: build with make, tag the version, move the
# lightweight "latest" tag to this commit, and replace the files on the
# existing "latest" release. The release's title and body are left
# exactly as they are: gh release upload touches assets only.

on:
  # Anything landing on main is a release: a merge, or a direct push.
  # Tag pushes do not match a branch filter, so the tags this workflow
  # pushes cannot trigger it again.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession would otherwise race: both force-move
# the latest tag and clobber the same assets, and the loser decides
# what the release ends up holding. Newest commit wins instead.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    # The push trigger already filters to main; this is what stops a
    # manual dispatch from some other branch tagging and releasing it.
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Check the APP_UUID_KEY secret is set
      # Without it, make would quietly fall back to the sample UUID and
      # release under the wrong name. Fail here, before the toolchains.
      env:
        APP_UUID_KEY: ${{ secrets.APP_UUID_KEY }}
      run: test -n "$APP_UUID_KEY" || { echo "The APP_UUID_KEY secret is not set."; exit 1; }

    - name: Checkout the code
      # No submodules here: the m68k side needs none, and rp/build.sh
      # inits and pins the Pico SDK tree itself.
      uses: actions/checkout@v4

    - name: Host tests
      run: make test

    - name: Set up Python
      # target/atarist/build.sh runs a bare "python", which ubuntu-latest
      # does not have; setup-python puts one on PATH. Stdlib only.
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install the Pico Toolchain
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential libstdc++-arm-none-eabi-newlib

    - name: Install AtariST Toolkit Docker image
      # Track the latest installer: older ones took the image tag from
      # the ambient $VERSION, which build.sh exports from version.txt, so
      # CI went looking for an image tagged with the app's own version.
      # The account is ours rather than the upstream default because the
      # driver is built with m68k-atari-mint-gcc, which is in these
      # images (they are what every local build uses too). On this
      # runner that is the x86_64 image, which only exists as :latest.
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/latest/download/install_atarist_toolkit_docker.sh | DOCKER_ACCOUNT=neilrackett bash

    - name: Build
      # The Makefile skips the version bump, so this builds exactly what
      # the tree says. The app UUID comes from the APP_UUID_KEY secret;
      # uuid.txt is deliberately not committed. STCMD_IMAGE points
      # build.sh's direct docker run (the driver and installer step) at
      # the same x86_64 image stcmd was installed with; its default is
      # the arm64 image used on the development Macs.
      env:
        APP_UUID_KEY: ${{ secrets.APP_UUID_KEY }}
        STCMD_IMAGE: neilrackett/atarist-toolkit-docker-x86_64:latest
      run: make

    - name: Build the STinG bundle
      # The ready-to-go STinG that the README sends people to. Not part
      # of make because it downloads the stock distribution.
      run: tools/make_sting_bundle.sh dist

    - name: Tag the version and move latest
      run: |
        VERSION=$(tr -d '\r\n' < version.txt)
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "Tag $VERSION already exists; leaving it where it is."
        else
          git tag "$VERSION"
        fi
        git tag -f latest
        git push origin "refs/tags/$VERSION" +refs/tags/latest

    - name: Replace the files on the latest release
      # The SidecarT only lists the app when the UF2 and JSON share a
      # name, so the versioned UF2 the build produces is renamed here.
      env:
        GH_TOKEN: ${{ github.token }}
        UUID: ${{ secrets.APP_UUID_KEY }}
      run: |
        VERSION=$(tr -d '\r\n' < version.txt)
        cp "dist/$UUID-$VERSION.uf2" "dist/$UUID.uf2"
        gh release upload latest "dist/$UUID.uf2" "dist/$UUID.json" dist/sting-for-mdnet.zip --clobber
