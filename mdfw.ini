; mdfw.ini - MD/Net built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/Net
output = build/md-net.mdfw
; Built on the SidecarTridge microfirmware template: its own main() runs,
; with EmuMD standing in for the template's hardware (romemul.c,
; commemul.c, select.c, hw_config.c and sdcard.c are left out) and the
; Booster. The version and app UUID come from version.txt and uuid.txt.
template = sidecartridge

[sources]
; The firmware, as rp/src/CMakeLists.txt lists it (and any libraries).
files =
    rp/src/*.c
    rp/src/settings/settings.c
exclude =

[compile]
; Your own stand-ins for hardware-only headers, searched first.
shims =
include =
    rp/src
    rp/src/include
    rp/src/settings
; What rp/src/CMakeLists.txt defines, besides the template's usual ones.
defines =
cflags = -O2

; The Pico W's Wi-Fi, through this computer's network (needs libslirp).
[wifi]
lwip = pico-sdk/lib/lwip
; apps = http/http_client.c  ; lwIP apps you use, from its src/apps
arch = poll

[run]
machine = ste
sd = build/sd          ; the microSD card (the firmware makes /mdnet)
harddrive = build/hdd  ; C:, with STinG set up (local, not in git)
; 640x480 in 16 colours (Hatari's extended VDI), and room for HighWire
hatari_args = --memsize 4 --vdi on --vdi-planes 4 --vdi-width 640 --vdi-height 480
